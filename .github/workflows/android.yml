name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maths-quest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a pre-release
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MathsQuest-debug-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" MathsQuest-debug-${{ github.run_number }}.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Maths Quest debug build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.ref_name }} at ${{ github.sha }}. Install on Android 8.0+ (allow installs from unknown sources)."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

  screens:
    # Runs the app on an emulator, walks every screen with the demo family, and publishes screenshots.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run the app tour on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.mathsquest.app.AppTourTest com.mathsquest.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.log
            adb exec-out run-as com.mathsquest.app tar c files/screens > screens.tar

      - name: Collect screenshots
        run: |
          mkdir -p screens && tar xf screens.tar -C screens --strip-components=2
          ls -la screens
          if grep -q "FAILURES" instrument.log; then cat instrument.log; exit 1; fi
          test "$(ls screens/*.png | wc -l)" -ge 21

      - name: Publish screenshots
        if: always()
        run: |
          ls screens/*.png >/dev/null 2>&1 || exit 0
          gh release create "screens-${{ github.run_number }}" screens/*.png instrument.log \
            --prerelease --target "${{ github.sha }}" \
            --title "Maths Quest screenshots ${{ github.run_number }}" \
            --notes "Screens captured on a Pixel 6 emulator (Android 11) by AppTourTest from ${{ github.sha }}."
        env:
          GH_TOKEN: ${{ github.token }}
