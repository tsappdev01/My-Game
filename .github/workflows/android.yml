name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maths-quest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a pre-release
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MathsQuest-debug-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" MathsQuest-debug-${{ github.run_number }}.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Maths Quest debug build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.ref_name }} at ${{ github.sha }}. Install on Android 8.0+ (allow installs from unknown sources)."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
